<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>
    <style>
        #login-form {
            display: none;
        }
        .logout-link {
            font-weight: normal;
            font-style: italic;
            font-size: 10px;
            margin-left: 10px;
        }
    </style>
    <!-- Add js-cookie CDN -->
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
</head>
<body>
    <!-- Welcome message or Login Form -->
    <div id="welcome-message"></div>
    <!-- Login Form (hidden initially) -->
    <div id="login-form">
        <h2>Login to the website</h2>
        <!-- Firstname Input -->
        <input type="text" id="firstname" placeholder="Firstname">
        <br>
        <!-- Email Input -->
        <input type="email" id="email" placeholder="Email">
        <br><br>
        <!-- Log me in button -->
        <button onclick="setCookiesAndShowWelcomeMessage()">Log me in</button>
    </div>   
    <script>
        // Function to set cookies with an expiration of 10 days using js-cookie
        function setCookiesAndShowWelcomeMessage() {
            var firstname = document.getElementById('firstname').value;
            var email = document.getElementById('email').value;
            // Set cookies with expiration date (10 days from now)
            var expirationDate = new Date();
            expirationDate.setTime(expirationDate.getTime() + (10 * 24 * 60 * 60 * 1000)); // 10 days
            Cookies.set('firstname', firstname, { expires: expirationDate, path: '/' });
            Cookies.set('email', email, { expires: expirationDate, path: '/' });
            showWelcomeMessageOrForm();  // Check login status after setting cookies
        }
        // Function to show the login form
        function showForm() {
            // Hide any existing welcome message
            var welcomeMessage = document.getElementById('welcome-message');
            if (welcomeMessage) {
                welcomeMessage.innerHTML = '';
            }
            // Show the login form
            document.getElementById('login-form').style.display = 'block';
        }
        // Function to hide the login form
        function hideForm() {
            document.getElementById('login-form').style.display = 'none';
        }
        // Function to remove cookies and show the form using js-cookie
        function deleteCookiesAndShowForm() {
            Cookies.remove('firstname', { path: '/' });
            Cookies.remove('email', { path: '/' });
            showForm(); // Show the form after deleting cookies
        }
        // Function to display the welcome message or the login form
        function showWelcomeMessageOrForm() {
            var firstname = Cookies.get('firstname');
            var email = Cookies.get('email');
            var welcomeMessage = document.getElementById('welcome-message');

            if (firstname && email) {
                // If user is logged in, show the welcome message
                welcomeMessage.innerHTML = '';
                var welcomeMessageH1 = document.createElement('h1');
                welcomeMessageH1.textContent = `Welcome: ${firstname} `;
                var logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.textContent = 'logout';
                logoutLink.classList.add('logout-link');
                logoutLink.onclick = function() {
                    deleteCookiesAndShowForm(); // Log out user by deleting cookies
                };
                welcomeMessageH1.appendChild(logoutLink);
                welcomeMessage.appendChild(welcomeMessageH1);
                // Hide the form
                hideForm();
            } else {
                // If user is not logged in, show the form
                showForm();
            }
        }
        // Initially check if the user is logged in and display 
        window.onload = function() {
            showWelcomeMessageOrForm();
        };
    </script>
</body>
</html>
